# System power management. On nRF52832, the idle thread waits for events
# (System ON idle); no explicit System OFF transition is requested.
CONFIG_PM=y
CONFIG_TICKLESS_KERNEL=y

# GPIO application; no serial console/logging during power measurements.
CONFIG_GPIO=y
CONFIG_SERIAL=n
CONFIG_CONSOLE=n
CONFIG_UART_CONSOLE=n
CONFIG_PRINTK=n
CONFIG_LOG=n

# Keep the benchmark small and deterministic.
CONFIG_MAIN_STACK_SIZE=1024
CONFIG_ASSERT=y
CONFIG_SCENARIO_LED=y
CONFIG_SCENARIO_PERIOD_MS=5000
CONFIG_SCENARIO_PULSE_MS=50
CONFIG_SCENARIO_WORKLOAD_ITERATIONS=4096
